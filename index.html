<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明明專業洗衣 - 線上預約</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef2f5; padding: 15px; margin: 0; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .header { text-align: center; margin-bottom: 15px; }
    .header h2 { color: #0b57d0; margin: 0 0 5px; font-size: 1.6rem; }
    .header p { color: #666; margin: 0; font-size: 0.9rem; }
    .free-shipping-tag { background: #e8f0fe; color: #0b57d0; text-align: center; padding: 8px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; margin-bottom: 20px; }

    .section-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    
    .category-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
    .category-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { background: #f0f4f9; border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; color: #444; font-weight: 500; white-space: nowrap; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
    .tab-btn.active { background: #0b57d0; color: white; font-weight: bold; }

    .item-list { min-height: 250px; max-height: 380px; overflow-y: auto; padding-right: 5px; }
    .item-card { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .item-info .title { font-weight: 600; font-size: 0.98rem; color: #222; }
    .item-info .price { color: #666; font-size: 0.85rem; margin-top: 3px; }
    
    .qty-control { display: flex; align-items: center; gap: 12px; }
    .btn-qty { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #0b57d0; background: white; color: #0b57d0; font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .btn-qty:active { background: #0b57d0; color: white; }
    .qty-val { font-weight: bold; font-size: 1.05rem; min-width: 20px; text-align: center; }

    /* 總計金額計算卡片 */
    .summary-card { background: #f8f9fa; border-radius: 10px; padding: 15px; margin: 15px 0; border: 1px solid #e9ecef; }
    .summary-line { display: flex; justify-content: space-between; font-size: 0.9rem; color: #555; margin-bottom: 6px; }
    .summary-line.total { font-size: 1.1rem; font-weight: bold; color: #0b57d0; margin-top: 8px; border-top: 1px dashed #ccc; padding-top: 8px; }

    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 6px; font-size: 0.9rem; color: #444; }
    input, select, textarea { width: 100%; padding: 11px; border: 1px solid #dcdfe6; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; }
    
    .btn-submit { width: 100%; background: #0b57d0; color: white; padding: 15px; font-size: 1.1rem; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>明明專業洗衣</h2>
    <p>線上預約專車收送服務</p>
  </div>
  <div class="free-shipping-tag">🚚 消費滿 NT$ 400 免收運費（未達門檻另收 NT$ 100 運費）</div>

  <form id="bookingForm" onsubmit="submitForm(event)">
    <div class="section-title">🧺 1. 選擇送洗品項</div>

    <div class="category-tabs" id="tabsContainer"></div>
    <div class="item-list" id="itemListContainer"></div>

    <div class="summary-card">
      <div class="summary-line"><span>洗滌費用小計：</span><span id="txtSubtotal">NT$ 0</span></div>
      <div class="summary-line"><span>運費：</span><span id="txtShipping">NT$ 0</span></div>
      <div class="summary-line total"><span>預估總金額：</span><span id="txtTotal">NT$ 0</span></div>
    </div>

    <hr style="border:none; border-top:1px solid #eee; margin:20px 0;">

    <div class="section-title">📍 2. 客戶與收送資訊</div>
    <div class="form-group">
      <label>姓名 *</label>
      <input type="text" id="name" required placeholder="請輸入姓名">
    </div>
    <div class="form-group">
      <label>電話 *</label>
      <input type="tel" id="phone" required placeholder="例如：0912345678">
    </div>
    <div class="form-group">
      <label>收送地址 *</label>
      <input type="text" id="address" required placeholder="請輸入完整門牌地址">
    </div>
    <div class="form-group">
      <label>預約收送時間 *</label>
      <div style="display:flex; gap:10px;">
        <input type="date" id="pickupDate" required style="flex:1;">
        <select id="pickupTime" required style="flex:1;">
          <option value="">請選擇時段</option>
          <option value="上午 (09:00 - 12:00)">上午 (09:00-12:00)</option>
          <option value="下午 (14:00 - 17:00)">下午 (14:00-17:00)</option>
          <option value="晚上 (18:00 - 21:00)">晚上 (18:00-21:00)</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>備註需求（選填）</label>
      <textarea id="note" rows="2" placeholder="例如：放置管理室、特殊污漬說明..."></textarea>
    </div>

    <button type="submit" id="submitBtn" class="btn-submit">送出預約並開啟 LINE</button>
  </form>
</div>

<script>

      ]
    },
    {
      name: "機能性品項類",
      items: [
        { id: "f1", name: "機能型外套", price: 400 },
        { id: "f2", name: "GORE-TEX 衣服", price: 400 },

        { id: "f9", name: "GORE-TEX 撥水加工", price: 500 },
        { id: "f10", name: "雪衣 撥水加工", price: 600 },

        { id: "f13", name: "吊帶褲 撥水加工", price: 600 },

      ]
    },

      ]
    },

        { id: "b15", name: "羽絨", price: 700 },
        { id: "b16", name: "羊毛", price: 700 },
        { id: "b17", name: "蠶絲被", price: 700 },
        { id: "b18", name: "睡袋", price: 500 },
        { id: "b19", name: "腳踏墊", price: 150 }
      ]
    },
    {

      items: [
        { id: "s1", name: "單人沙發套", price: 150 },
        { id: "s2", name: "雙人沙發套", price: 300 },

      ]
    },
    {
      name: "玩偶類",
      items: [
        { id: "t1", name: "毛絨玩偶長度30公分", price: 150 },
        { id: "t2", name: "毛絨小型玩偶60公分", price: 250 },
        { id: "t3", name: "毛絨中型玩偶90公分", price: 400 },
        { id: "t4", name: "毛絨大型玩偶120公分", price: 500 }
      ]
    },
    {
      name: "小件類",
      items: [
        { id: "a1", name: "領帶", price: 80 },
        { id: "a2", name: "手套", price: 80 },
        { id: "a3", name: "絲巾", price: 150 },
        { id: "a4", name: "圍巾薄", price: 200 },
        { id: "a5", name: "圍巾厚", price: 300 },
        { id: "a6", name: "披肩", price: 300 },
        { id: "a7", name: "棒球帽", price: 150 },
        { id: "a8", name: "毛帽", price: 150 }
      ]
    },
    {
      name: "其他類",
      items: [
        { id: "o1", name: "窗簾120公分(摺)", price: 80 },
        { id: "o2", name: "窗簾180公分(摺)", price: 100 },
        { id: "o3", name: "窗簾210公分(摺)", price: 120 },
        { id: "o4", name: "地毯", price: "估價" },
        { id: "o5", name: "各式包包清洗", price: "估價" }
      ]
    },
    {
      name: "特殊處理",
      items: [
        { id: "sp1", name: "黃斑特殊處理", price: "估價" },
        { id: "sp2", name: "染色處理", price: "估價" }
      ]
    }
  ];

  var cart = {};
  var currentCatIndex = 0;

  document.addEventListener("DOMContentLoaded", function() {
    renderTabs();
    renderItems(0);
    calculateSummary();
  });

  function renderTabs() {
    var container = document.getElementById("tabsContainer");
    var html = "";
    for (var i = 0; i < categories.length; i++) {
      var activeClass = i === currentCatIndex ? "active" : "";
      html += '<button type="button" class="tab-btn ' + activeClass + '" onclick="switchTab(' + i + ')">' + categories[i].name + '</button>';
    }
    container.innerHTML = html;
  }

  function switchTab(index) {
    currentCatIndex = index;
    renderTabs();
    renderItems(index);
  }

  function renderItems(catIndex) {
    var container = document.getElementById("itemListContainer");
    var items = categories[catIndex].items;
    var html = "";

    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var qty = cart[item.id] || 0;
      var priceDisplay = (typeof item.price === "number") ? "NT$ " + item.price : item.price;

      html += '<div class="item-card">' +
                '<div class="item-info">' +
                  '<div class="title">' + item.name + '</div>' +
                  '<div class="price">' + priceDisplay + '</div>' +
                '</div>' +
                '<div class="qty-control">' +
                  '<button type="button" class="btn-qty" onclick="updateQty(\'' + item.id + '\', -1)">-</button>' +
                  '<span class="qty-val">' + qty + '</span>' +
                  '<button type="button" class="btn-qty" onclick="updateQty(\'' + item.id + '\', 1)">+</button>' +
                '</div>' +
              '</div>';
    }
    container.innerHTML = html;
  }

  function updateQty(itemId, change) {
    var currentQty = cart[itemId] || 0;
    var newQty = currentQty + change;
    if (newQty < 0) newQty = 0;
    
    if (newQty === 0) {
      delete cart[itemId];
    } else {
      cart[itemId] = newQty;
    }
    
    renderItems(currentCatIndex);
    calculateSummary();
  }

  // 計算金額、運費與總計
  function calculateSummary() {
    var subtotal = 0;
    var hasEstimate = false;

    for (var c = 0; c < categories.length; c++) {
      for (var i = 0; i < categories[c].items.length; i++) {
        var item = categories[c].items[i];
        if (cart[item.id] && cart[item.id] > 0) {
          if (typeof item.price === "number") {
            subtotal += item.price * cart[item.id];
          } else {
            hasEstimate = true;
          }
        }
      }
    }

    var shipping = 0;
    if (subtotal > 0 && subtotal < 400) {
      shipping = 100;
    }

    var total = subtotal + shipping;

    document.getElementById("txtSubtotal").innerText = "NT$ " + subtotal + (hasEstimate ? " (含估價項目)" : "");
    document.getElementById("txtShipping").innerText = subtotal === 0 ? "NT$ 0" : (shipping === 0 ? "NT$ 0 (已達免運門檻)" : "NT$ " + shipping);
    document.getElementById("txtTotal").innerText = "NT$ " + total + (hasEstimate ? " + 另計估價" : "");

    return { subtotal: subtotal, shipping: shipping, total: total, hasEstimate: hasEstimate };
  }

  function submitForm(e) {
    e.preventDefault();

    var submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.innerText = "預約處理中...";

    var summary = calculateSummary();
    
    var selectedList = [];
    for (var c = 0; c < categories.length; c++) {
      for (var i = 0; i < categories[c].items.length; i++) {
        var item = categories[c].items[i];
        if (cart[item.id] && cart[item.id] > 0) {
          selectedList.push(item.name + " x " + cart[item.id]);
        }
      }
    }

    var itemsText = selectedList.length > 0 ? selectedList.join(", ") : "未點選（現場點交）";

    // 打包送往 Google 試算表 (完全對應 A~K 欄)
    var formData = {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      address: document.getElementById("address").value,
      pickupDate: document.getElementById("pickupDate").value,
      pickupTime: document.getElementById("pickupTime").value,
      itemsText: itemsText,
      subtotal: "NT$ " + summary.subtotal,
      shipping: summary.shipping === 0 ? "免運" : "NT$ " + summary.shipping,
      total: "NT$ " + summary.total + (summary.hasEstimate ? " (含估價)" : ""),
      note: document.getElementById("note").value || "無"
    };

    // 填入 Apps Script 部署 URL
    var GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9ObXPi7RAs_aJksENKEC89v6f2SyhMEdkoD7nAN4oCqUVQI9k5GUHINFaRO8u-ngB6w/exec";

    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(formData)
    }).then(function() {
      // 組合 LINE 訊息內容
      var lineMsg = "【明明專業洗衣 - 線上預約】\n" +
        "-------------------------\n" +
        "👤 姓名：" + formData.name + "\n" +
        "📞 電話：" + formData.phone + "\n" +
        "📍 地址：" + formData.address + "\n" +
        "📅 時間：" + formData.pickupDate + " " + formData.pickupTime + "\n" +
        "👕 送洗品項：\n" + selectedList.join("\n") + "\n\n" +
        "💰 費用試算：\n" +
        "• 小計：" + formData.subtotal + "\n" +
        "• 運費：" + formData.shipping + "\n" +
        "• 預估總金額：" + formData.total + "\n" +
        "📝 備註：" + formData.note + "\n" +
        "-------------------------\n" +
        "預約已送出，請等待店家專人確認！";

      var LINE_ID = "@854mkark"; // 填入貴店的 LINE ID
      var lineUrl = "https://line.me/R/oaMessage/" + LINE_ID + "/?" + encodeURIComponent(lineMsg);

      alert("預約成功！資料已成功同步寫入試算表。按下「確定」跳轉至 LINE 發送預約訊息。");
      window.location.href = lineUrl;
    }).catch(function(err) {
      alert("傳送失敗，請稍後再試。");
      submitBtn.disabled = false;
      submitBtn.innerText = "送出預約並開啟 LINE";
    });
  }
</script>

</html>
