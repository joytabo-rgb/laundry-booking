<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明明專業洗衣 - 線上預約</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      padding: 24px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      color: #1a365d;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2b6cb0;
      margin-top: 20px;
      margin-bottom: 12px;
      border-bottom: 2px solid #ebf8ff;
      padding-bottom: 6px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #4a5568;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49,130,206,0.15);
    }
    .item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed #e2e8f0;
    }
    .item-info {
      flex: 1;
    }
    .item-name {
      font-weight: 500;
      font-size: 0.95rem;
    }
    .item-price {
      font-size: 0.85rem;
      color: #718096;
    }
    .counter {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-counter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #cbd5e0;
      background: #edf2f7;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2d3748;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-counter:active {
      background: #e2e8f0;
    }
    .count-display {
      width: 24px;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
    }
    .summary-box {
      background-color: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #4a5568;
    }
    .summary-row.total {
      border-top: 1px dashed #cbd5e0;
      padding-top: 8px;
      margin-bottom: 0;
      font-weight: bold;
      font-size: 1.1rem;
      color: #2b6cb0;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
      transition: background-color 0.2s;
    }
    .btn-submit:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>明明專業洗衣 - 線上預約</h2>

  <form id="bookingForm" onsubmit="submitForm(event)">
    <!-- 1. 基本資料 -->
    <div class="section-title">1. 聯絡資料</div>
    <div class="form-group">
      <label for="name">姓名 *</label>
      <input type="text" id="name" required placeholder="請輸入姓名">
    </div>
    <div class="form-group">
      <label for="phone">電話 *</label>
      <input type="tel" id="phone" required placeholder="請輸入聯絡電話">
    </div>
    <div class="form-group">
      <label for="address">收送地址 *</label>
      <input type="text" id="address" required placeholder="請輸入完整收送地址">
    </div>

    <!-- 2. 品項選擇 -->
    <div class="section-title">2. 送洗品項選擇</div>
    <div id="itemsContainer"></div>

    <!-- 費用小計卡片 -->
    <div class="summary-box">
      <div class="summary-row">
        <span>洗滌費用小計：</span>
        <span id="subtotalDisplay">NT$ 0</span>
      </div>
      <div class="summary-row">
        <span>運費：</span>
        <span id="shippingDisplay">NT$ 0</span>
      </div>
      <div class="summary-row total">
        <span>預估總金額：</span>
        <span id="totalDisplay">NT$ 0</span>
      </div>
    </div>

    <!-- 3. 時間與備註 -->
    <div class="section-title">3. 預約收送時間與備註</div>
    <div class="form-group">
      <label for="pickupDate">希望收件日期 *</label>
      <input type="date" id="pickupDate" required>
    </div>
    <div class="form-group">
      <label for="pickupTime">希望收件時段 *</label>
      <select id="pickupTime" required>
        <option value="">請選擇時段</option>
        <option value="上午 (09:00 - 12:00)">上午 (09:00 - 12:00)</option>
        <option value="下午 (14:00 - 17:00)">下午 (14:00 - 17:00)</option>
        <option value="晚上 (18:00 - 21:00)">晚上 (18:00 - 21:00)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="note">備註需求 (選填)</label>
      <textarea id="note" rows="3" placeholder="例如：放置管理室、特殊污漬說明..."></textarea>
    </div>

    <button type="submit" id="submitBtn" class="btn-submit">送出預約並開啟 LINE</button>
  </form>
</div>

<script>
  // 請填入您的 Google Apps Script Web App URL
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyQaoEAxBnyzo1wVW7Wgv0yG9_hhyqgT9WB5QxDLoRNgpWKx4mwPOMAbShhLqjKBH7TjQ/exec";

  // 送洗品項清單資料
  const itemsData = [
    { name: "上衣 / 襯衫", price: 100 },
    { name: "外套 / 西裝外套", price: 200 },
    { name: "長褲 / 短褲", price: 120 },
    { name: "羽絨外套 / 大衣", price: 350 },
    { name: "各式包包清洗", price: 0, isEstimate: true } // 0 代表需要另行估價
  ];

  const itemCounts = {};

  // 初始化選單
  function initItems() {
    const container = document.getElementById("itemsContainer");
    itemsData.forEach((item, index) => {
      itemCounts[index] = 0;
      const card = document.createElement("div");
      card.className = "item-card";
      
      const priceText = item.isEstimate ? "專人另行估價" : `NT$ ${item.price}`;
      
      card.innerHTML = `
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-price">${priceText}</div>
        </div>
        <div class="counter">
          <button type="button" class="btn-counter" onclick="updateCount(${index}, -1)">-</button>
          <span class="count-display" id="count-${index}">0</span>
          <button type="button" class="btn-counter" onclick="updateCount(${index}, 1)">+</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // 更新數量與費用
  function updateCount(index, delta) {
    if (itemCounts[index] + delta >= 0) {
      itemCounts[index] += delta;
      document.getElementById(`count-${index}`).innerText = itemCounts[index];
      calculateSummary();
    }
  }

  // 計算總價與運費
  function calculateSummary() {
    let subtotal = 0;
    let hasEstimateItem = false;
    let totalItems = 0;

    itemsData.forEach((item, index) => {
      const qty = itemCounts[index];
      totalItems += qty;
      if (qty > 0) {
        if (item.isEstimate) {
          hasEstimateItem = true;
        } else {
          subtotal += item.price * qty;
        }
      }
    });

    // 運費規則：未滿 500 元加收 80 元運費（可自行調整）
    let shipping = (subtotal < 500 && totalItems > 0) ? 80 : 0;
    let total = subtotal + shipping;

    document.getElementById("subtotalDisplay").innerText = `NT$ ${subtotal}`;
    document.getElementById("shippingDisplay").innerText = shipping > 0 ? `NT$ ${shipping}` : "NT$ 0 (免運)";
    document.getElementById("totalDisplay").innerText = `NT$ ${total}` + (hasEstimateItem ? " (含估價品項)" : "");

    return { subtotal, shipping, total, hasEstimate: hasEstimateItem };
  }

  // 取得已選品項明細字串陣列
  function getSelectedItemsArray() {
    const list = [];
    itemsData.forEach((item, index) => {
      const qty = itemCounts[index];
      if (qty > 0) {
        const priceStr = item.isEstimate ? "另行估價" : `NT$ ${item.price * qty}`;
        list.push(`• ${item.name} x ${qty} (${priceStr})`);
      }
    });
    return list;
  }

  // 表單送出事件處理
  function submitForm(e) {
    e.preventDefault();

    const selectedList = getSelectedItemsArray();
    if (selectedList.length === 0) {
      alert("請至少選擇一項送洗品項！");
      return;
    }

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.innerText = "資料傳送中，請稍候...";

    const summary = calculateSummary();
    
    const formData = {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      address: document.getElementById("address").value,
      pickupDate: document.getElementById("pickupDate").value,
      pickupTime: document.getElementById("pickupTime").value,
      itemsDetail: selectedList.join(", "),
      subtotal: "NT$ " + summary.subtotal,
      shipping: "NT$ " + summary.shipping,
      total: "NT$ " + summary.total + (summary.hasEstimate ? " (含估價)" : ""),
      note: document.getElementById("note").value || "無"
    };

    // 組合 LINE 訊息內容
    const lineMsg = "【明明專業洗衣 - 線上預約】\n" +
      "------------------------------\n" +
      "👤 姓名：" + formData.name + "\n" +
      "📞 電話：" + formData.phone + "\n" +
      "📍 地址：" + formData.address + "\n" +
      "📅 時間：" + formData.pickupDate + " " + formData.pickupTime + "\n" +
      "👕 送洗品項：\n" + selectedList.join("\n") + "\n\n" +
      "💰 費用試算：\n" +
      "• 小計：" + formData.subtotal + "\n" +
      "• 運費：" + formData.shipping + "\n" +
      "• 預估總金額：" + formData.total + "\n" +
      "📝 備註：" + formData.note + "\n" +
      "------------------------------\n" +
      "預約已送出，請等待店家專人確認！";

    // 使用通用的 LINE 分享文字連結
    const lineUrl = "https://line.me/R/share?text=" + encodeURIComponent(lineMsg);

    // 發送資料至 Google Apps Script
    fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(formData)
    })
    .then(function() {
      // 復原按鈕狀態
      submitBtn.disabled = false;
      submitBtn.innerText = "送出預約並開啟 LINE";

      // 開啟 LINE 分享/傳送畫面
      window.location.href = lineUrl;
    })
    .catch(function(err) {
      alert("傳送失敗，請稍後再試。");
      console.error("Error:", err);
      submitBtn.disabled = false;
      submitBtn.innerText = "送出預約並開啟 LINE";
    });
  }

  // 初始化頁面預設值
  window.onload = function() {
    initItems();
    // 預設日期為明天
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById("pickupDate").value = tomorrow.toISOString().split('T')[0];
  };
</script>

</body>
</html>
