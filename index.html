<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明明專業洗衣 - 線上收送預約系統</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --secondary-color: #e6f0fa;
      --accent-color: #d9534f;
      --text-color: #333;
      --bg-color: #f8f9fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 40px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
    }

    .header {
      text-align: center;
      padding: 20px 0;
      background-color: var(--primary-color);
      color: white;
      border-radius: 10px 10px 0 0;
    }

    .notice-bar {
      background-color: var(--secondary-color);
      padding: 10px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--primary-color);
      border-bottom: 1px solid #cce0f5;
    }

    .section {
      background: white;
      padding: 20px;
      margin-top: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 15px;
      border-bottom: 2px solid var(--secondary-color);
      padding-bottom: 5px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }

    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .item-card {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      background: #fff;
    }

    .item-title {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .item-price {
      font-size: 0.85rem;
      color: #666;
      margin: 4px 0;
    }

    .quantity-control {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .btn-qty {
      width: 28px;
      height: 28px;
      border: none;
      background-color: var(--secondary-color);
      color: var(--primary-color);
      font-weight: bold;
      border-radius: 50%;
      cursor: pointer;
    }

    .summary-card {
      background: #f1f7fe;
      border: 1px dashed var(--primary-color);
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
      border-top: 1px solid #ccc;
      padding-top: 8px;
      margin-top: 8px;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn-submit:hover {
      background-color: #004085;
    }

    .btn-submit:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>明明專業洗衣</h1>
    <p style="font-size: 0.9rem; margin-top: 5px;">線上預約專車收送服務</p>
  </div>

  <div class="notice-bar">
    🚚 消費滿 NT$ 400 免收運費（未達門檻另收 NT$ 100 運費）
  </div>

  <form id="bookingForm" onsubmit="event.preventDefault(); submitBooking();">
    <!-- 聯絡資訊 -->
    <div class="section">
      <div class="section-title">1. 客戶聯絡資訊</div>
      <div class="form-group">
        <label for="name">姓名 *</label>
        <input type="text" id="name" required placeholder="請輸入姓名">
      </div>
      <div class="form-group">
        <label for="phone">電話 *</label>
        <input type="tel" id="phone" required placeholder="例：0912345678">
      </div>
      <div class="form-group">
        <label for="address">收送地址 *</label>
        <input type="text" id="address" required placeholder="請輸入完整門牌地址">
      </div>
    </div>

    <!-- 洗滌品項選擇 -->
    <div class="section">
      <div class="section-title">2. 選擇洗滌品項（預估）</div>
      <div class="item-grid">
        <div class="item-card">
          <div class="item-title">日常上衣/襯衫</div>
          <div class="item-price">NT$ 80 元起</div>
          <div class="quantity-control">
            <button type="button" class="btn-qty" onclick="changeQty('top', -1)">-</button>
            <span id="qty-top">0</span>
            <button type="button" class="btn-qty" onclick="changeQty('top', 1)">+</button>
          </div>
        </div>

        <div class="item-card">
          <div class="item-title">褲款/裙款</div>
          <div class="item-price">NT$ 100 元起</div>
          <div class="quantity-control">
            <button type="button" class="btn-qty" onclick="changeQty('bottom', -1)">-</button>
            <span id="qty-bottom">0</span>
            <button type="button" class="btn-qty" onclick="changeQty('bottom', 1)">+</button>
          </div>
        </div>

        <div class="item-card">
          <div class="item-title">外套/西裝</div>
          <div class="item-price">NT$ 200 元起</div>
          <div class="quantity-control">
            <button type="button" class="btn-qty" onclick="changeQty('jacket', -1)">-</button>
            <span id="qty-jacket">0</span>
            <button type="button" class="btn-qty" onclick="changeQty('jacket', 1)">+</button>
          </div>
        </div>

        <div class="item-card">
          <div class="item-title">雪衣/滑雪服</div>
          <div class="item-price">NT$ 350 元起</div>
          <div class="quantity-control">
            <button type="button" class="btn-qty" onclick="changeQty('ski', -1)">-</button>
            <span id="qty-ski">0</span>
            <button type="button" class="btn-qty" onclick="changeQty('ski', 1)">+</button>
          </div>
        </div>

        <div class="item-card">
          <div class="item-title">羽絨外套</div>
          <div class="item-price">NT$ 300 元起</div>
          <div class="quantity-control">
            <button type="button" class="btn-qty" onclick="changeQty('down', -1)">-</button>
            <span id="qty-down">0</span>
            <button type="button" class="btn-qty" onclick="changeQty('down', 1)">+</button>
          </div>
        </div>

        <div class="item-card">
          <div class="item-title">床單/被套</div>
          <div class="item-price">NT$ 250 元起</div>
          <div class="quantity-control">
            <button type="button" class="btn-qty" onclick="changeQty('bedding', -1)">-</button>
            <span id="qty-bedding">0</span>
            <button type="button" class="btn-qty" onclick="changeQty('bedding', 1)">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 預約時間與備註 -->
    <div class="section">
      <div class="section-title">3. 預約收送時間與備註</div>
      <div class="form-group">
        <label for="pickupDate">希望收件日期 *</label>
        <input type="date" id="pickupDate" required>
      </div>
      <div class="form-group">
        <label for="pickupTime">希望收件時段 *</label>
        <select id="pickupTime" required>
          <option value="">請選擇時段</option>
          <option value="上午 (09:00 - 12:00)">上午 (09:00 - 12:00)</option>
          <option value="下午 (14:00 - 17:00)">下午 (14:00 - 17:00)</option>
          <option value="晚上 (18:00 - 21:00)">晚上 (18:00 - 21:00)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="note">特殊需求備註</label>
        <textarea id="note" rows="3" placeholder="例如：衣服有特殊污漬需要重點處理、放置管理室等..."></textarea>
      </div>

      <!-- 費用小計卡片 -->
      <div class="summary-card">
        <div class="summary-row">
          <span>洗衣小計 (預估)：</span>
          <span>NT$ <span id="subtotal">0</span></span>
        </div>
        <div class="summary-row">
          <span>專車運費：</span>
          <span>NT$ <span id="shipping">0</span></span>
        </div>
        <div class="summary-total">
          <span>預估總計：</span>
          <span>NT$ <span id="total">0</span></span>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">確認預約並發送 LINE 訊息</button>
    </div>
  </form>
</div>

<script>
  // 【設定項目 1】請貼上第二步產生的 Google Apps Script Web App URL
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyY926n19SQhtRAzdTip5unK7ZnsHMA0TG-AJfqgA8dEAFwjadltzhnhmmRYYk2XdehPA/exec";

  // 【設定項目 2】請填寫你店家的 LINE 官方帳號 ID（例如：@123abcd）或 個人 LINE 連結
  const LINE_OFFICIAL_ID = "2011400784-69V5deMW"; 

  const itemNames = {
    top: "日常上衣/襯衫",
    bottom: "褲款/裙款",
    jacket: "外套/西裝",
    ski: "雪衣/滑雪服",
    down: "羽絨外套",
    bedding: "床單/被套"
  };

  const prices = {
    top: 80,
    bottom: 100,
    jacket: 200,
    ski: 350,
    down: 300,
    bedding: 250
  };

  const quantities = {
    top: 0,
    bottom: 0,
    jacket: 0,
    ski: 0,
    down: 0,
    bedding: 0
  };

  // 限制日期不能選擇今天以前
  document.getElementById('pickupDate').min = new Date().toISOString().split('T')[0];

  function changeQty(item, delta) {
    if (quantities[item] + delta >= 0) {
      quantities[item] += delta;
      document.getElementById(`qty-${item}`).innerText = quantities[item];
      calculateAll();
    }
  }

  function calculateAll() {
    let subtotal = 0;
    for (const key in quantities) {
      subtotal += quantities[key] * prices[key];
    }

    let shipping = (subtotal > 0 && subtotal < 400) ? 100 : 0;
    const total = subtotal + shipping;

    document.getElementById('subtotal').innerText = subtotal;
    document.getElementById('shipping').innerText = shipping;
    document.getElementById('total').innerText = total;
  }

  function submitBooking() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "預約處理中...";

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const address = document.getElementById('address').value;
    const date = document.getElementById('pickupDate').value;
    const time = document.getElementById('pickupTime').value;
    const note = document.getElementById('note').value || "無";
    const subtotal = document.getElementById('subtotal').innerText;
    const shipping = document.getElementById('shipping').innerText;
    const total = document.getElementById('total').innerText;

    // 整理品項清單
    let itemsText = [];
    for (const key in quantities) {
      if (quantities[key] > 0) {
        itemsText.push(`${itemNames[key]} x ${quantities[key]}`);
      }
    }
    const itemsString = itemsText.length > 0 ? itemsText.join(", ") : "未選擇預估品項";

    const formData = {
      name: name,
      phone: phone,
      address: address,
      pickupDate: date,
      pickupTime: time,
      items: itemsString,
      subtotal: subtotal,
      shipping: shipping,
      total: total,
      note: note
    };

    // 1. 將資料非同步寫入 Google 試算表 (方案 B)
    if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("你的SCRIPT_ID")) {
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
      }).catch(err => console.error("Google Sheet error:", err));
    }

    // 2. 組成 LINE 文字訊息並開啟 LINE (方案 A)
    const lineMessage = `【明明專業洗衣 - 預約收送】\n` +
      `-------------------------\n` +
      `👤 姓名：${name}\n` +
      `📞 電話：${phone}\n` +
      `📍 地址：${address}\n` +
      `📅 時間：${date} ${time}\n` +
      `👕 品項：${itemsString}\n` +
      `💵 預估金額：NT$ ${total} (運費 $${shipping})\n` +
      `📝 備註：${note}\n` +
      `-------------------------\n` +
      `已送出預約，請店家確認收件時間！`;

    const encodedMsg = encodeURIComponent(lineMessage);
    const lineUrl = `https://line.me/R/oaMessage/${LINE_OFFICIAL_ID}/?${encodedMsg}`;

    alert("預約成功！按「確定」將會自動跳轉至 LINE，請直接點擊「發送」將訊息傳給店家！");
    
    // 開啟 LINE 聊天室
    window.location.href = lineUrl;

    setTimeout(() => {
      btn.disabled = false;
      btn.innerText = "確認預約並發送 LINE 訊息";
    }, 3000);
  }
</script>

</body>
</html>
