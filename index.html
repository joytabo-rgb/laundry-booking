<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明明專業洗衣 - 線上送洗預約與估價</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --secondary-color: #f8f9fa;
      --accent-color: #d9534f;
      --border-color: #dee2e6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 25px;
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 10px;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #495057;
      margin-top: 20px;
      margin-bottom: 10px;
      border-left: 4px solid var(--primary-color);
      padding-left: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .item-select-box {
      background: var(--secondary-color);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .btn-add {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 10px;
    }

    .btn-add:hover {
      background-color: #004085;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: var(--secondary-color);
    }

    .btn-del {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .total-price-box {
      text-align: right;
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 15px;
      padding: 10px;
      background: #fff0f0;
      border-radius: 6px;
    }

    .btn-submit {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      margin-top: 20px;
    }

    .btn-submit:hover {
      background-color: #218838;
    }

    .btn-submit:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>明明專業洗衣 - 送洗預約單</h1>

  <!-- 顧客基本資料 -->
  <div class="section-title">顧客資訊</div>
  <div class="grid-2">
    <div class="form-group">
      <label for="custName">姓名 *：</label>
      <input type="text" id="custName" placeholder="請輸入姓名" required>
    </div>
    <div class="form-group">
      <label for="custPhone">電話 *：</label>
      <input type="tel" id="custPhone" placeholder="請輸入聯絡電話" required>
    </div>
  </div>
  <div class="form-group">
    <label for="custAddress">收送地址：</label>
    <input type="text" id="custAddress" placeholder="請輸入完整收送地址">
  </div>

  <!-- 選擇品項區塊 -->
  <div class="section-title">選擇送洗品項 (10大分類)</div>
  <div class="item-select-box">
    <div class="grid-2">
      <div class="form-group">
        <label for="categorySelect">選擇類別：</label>
        <select id="categorySelect" onchange="onCategoryChange()">
          <option value="">-- 請選擇類別 --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="itemSelect">選擇品項：</label>
        <select id="itemSelect" disabled>
          <option value="">-- 請先選擇類別 --</option>
        </select>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label for="itemQty">數量：</label>
        <input type="number" id="itemQty" value="1" min="1">
      </div>
      <div class="form-group" style="display: flex; align-items: flex-end;">
        <button class="btn-add" onclick="addItem()">加入送洗清單</button>
      </div>
    </div>
  </div>

  <!-- 已加入的送洗明細 -->
  <div class="section-title">送洗明細</div>
  <table>
    <thead>
      <tr>
        <th>類別</th>
        <th>品項名稱</th>
        <th>單價</th>
        <th>數量</th>
        <th>小計</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="cartTableBody">
      <tr>
        <td colspan="6" style="color: #6c757d;">目前尚未加入任何品項</td>
      </tr>
    </tbody>
  </table>

  <div id="totalDisplay" class="total-price-box">
    預估總金額：$0 元
  </div>

  <div class="form-group" style="margin-top: 15px;">
    <label for="orderNote">特別指示/備註（如污漬位置、特殊需求）：</label>
    <textarea id="orderNote" rows="3" placeholder="如有特殊狀況請在此註記"></textarea>
  </div>

  <button class="btn-submit" id="submitBtn" onclick="submitOrder()">送出預約單 (連動試算表與LINE)</button>
</div>

<script>
  // ⚠️ 請填入您的 Google Apps Script Web App URL 網址
  const scriptURL = 'https://script.google.com/macros/s/AKfycbzgJtCLPCNK_c8m7Xs1h1pmV4euFPMQi-NmG9M4XWo-eJr4F98jHRsdsunC9BvC6B4KMg/execL';

  // 明明專業洗衣 10 大分類完整價目表
  const priceList = {
    "一般衣服類": [
      { name: "西裝", price: 150 }, { name: "襯衫", price: 60 }, { name: "T SHIRT", price: 80 },
      { name: "POLO衫", price: 100 }, { name: "上衣", price: 120 }, { name: "運動衫", price: 100 },
      { name: "夾克", price: 180 }, { name: "短外套", price: 180 }, { name: "大衣", price: 300 },
      { name: "風衣", price: 400 }, { name: "洋裝", price: 180 }, { name: "連身服", price: 200 },
      { name: "旗袍", price: 250 }, { name: "棉襖", price: 250 }, { name: "毛衣", price: 150 },
      { name: "毛料背心", price: 150 }, { name: "薄背心", price: 120 }, { name: "刷毛背心", price: 150 },
      { name: "鋪棉背心", price: 180 }, { name: "羽絨背心", price: 250 }, { name: "輕羽絨衣", price: 250 },
      { name: "羽絨衣", price: 300 }, { name: "羽絨衣中長", price: 350 }, { name: "羽絨大衣", price: 450 },
      { name: "睡袍", price: 200 }, { name: "浴袍", price: 200 }, { name: "合成皮外套", price: 300 }
    ],
    "機能性品項類": [
      { name: "機能型外套", price: 400 }, { name: "GORE-TEX 衣服", price: 400 }, { name: "GORE-TEX 褲子", price: 400 },
      { name: "雪衣", price: 600 }, { name: "連身雪衣", price: 1000 }, { name: "雪褲", price: 600 },
      { name: "吊帶褲", price: 800 }, { name: "防寒手套", price: 300 }, { name: "GORE-TEX 撥水加工", price: 500 },
      { name: "雪衣 撥水加工", price: 600 }, { name: "雪褲 撥水加工", price: 600 }, { name: "連身衣 撥水加工", price: 1000 },
      { name: "吊帶褲 撥水加工", price: 600 }, { name: "防寒手套 撥水加工", price: 200 }
    ],
    "裙褲類": [
      { name: "西褲", price: 100 }, { name: "女長褲", price: 100 }, { name: "牛仔褲", price: 150 },
      { name: "休閒褲", price: 120 }, { name: "運動褲", price: 100 }, { name: "短褲", price: 80 },
      { name: "短裙", price: 80 }, { name: "褲裙", price: 100 }, { name: "長裙", price: 150 },
      { name: "毛裙", price: 180 }, { name: "絲絨裙", price: 200 }, { name: "半摺裙", price: 150 },
      { name: "百摺裙", price: 200 }, { name: "合成皮褲", price: 200 }, { name: "合成皮裙", price: 200 }
    ],
    "禮服類": [
      { name: "兒童禮服", price: 200 }, { name: "短禮服", price: 400 },
      { name: "長禮服", price: 700 }, { name: "新娘禮服", price: 1500 }
    ],
    "寢具用品類": [
      { name: "枕頭套", price: 80 }, { name: "抱枕套", price: 80 }, { name: "抱枕", price: 120 },
      { name: "枕頭芯", price: 400 }, { name: "床單薄", price: 160 }, { name: "床單厚", price: 200 },
      { name: "被套薄", price: 160 }, { name: "被套厚", price: 200 }, { name: "保潔墊", price: 170 },
      { name: "涼被", price: 400 }, { name: "棉被單人", price: 500 }, { name: "棉被雙人", price: 700 },
      { name: "毛絨被", price: 400 }, { name: "毛毯", price: 500 }, { name: "羽絨", price: 700 },
      { name: "羊毛", price: 700 }, { name: "蠶絲被", price: 700 }, { name: "睡袋", price: 500 }, { name: "腳踏墊", price: 150 }
    ],
    "沙發用品類": [
      { name: "單人沙發套", price: 150 }, { name: "雙人沙發套", price: 300 },
      { name: "三人沙發套", price: 400 }, { name: "桌巾", price: 150 }
    ],
    "玩偶類": [
      { name: "毛絨玩偶長度30公分", price: 150 }, { name: "毛絨小型玩偶60公分", price: 250 },
      { name: "毛絨中型玩偶90公分", price: 400 }, { name: "毛絨大型玩偶120公分", price: 500 }
    ],
    "小件類": [
      { name: "領帶", price: 80 }, { name: "手套", price: 80 }, { name: "絲巾", price: 150 },
      { name: "圍巾薄", price: 200 }, { name: "圍巾厚", price: 300 }, { name: "披肩", price: 300 },
      { name: "棒球帽", price: 150 }, { name: "毛帽", price: 150 }
    ],
    "其他類": [
      { name: "窗簾120公分(摺)", price: 80 }, { name: "窗簾180公分(摺)", price: 100 },
      { name: "窗簾210公分(摺)", price: 120 }, { name: "地毯", price: "估價" },
      { name: "各式包包清洗", price: "估價" }
    ],
    "特殊類": [
      { name: "黃斑特殊處理", price: "估價" }, { name: "染色處理", price: "估價" }
    ]
  };

  let cart = [];

  window.onload = function() {
    const categorySelect = document.getElementById("categorySelect");
    for (let cat in priceList) {
      let opt = document.createElement("option");
      opt.value = cat;
      opt.textContent = cat;
      categorySelect.appendChild(opt);
    }
  };

  function onCategoryChange() {
    const categorySelect = document.getElementById("categorySelect").value;
    const itemSelect = document.getElementById("itemSelect");

    itemSelect.innerHTML = '<option value="">-- 請選擇品項 --</option>';

    if (categorySelect && priceList[categorySelect]) {
      itemSelect.disabled = false;
      priceList[categorySelect].forEach((item, index) => {
        let opt = document.createElement("option");
        opt.value = index;
        opt.textContent = item.price === "估價" ? `${item.name} (另行估價)` : `${item.name} ($${item.price})`;
        itemSelect.appendChild(opt);
      });
    } else {
      itemSelect.disabled = true;
    }
  }

  function addItem() {
    const categoryVal = document.getElementById("categorySelect").value;
    const itemIdx = document.getElementById("itemSelect").value;
    const qty = parseInt(document.getElementById("itemQty").value) || 1;

    if (!categoryVal || itemIdx === "") {
      alert("請選擇類別與品項！");
      return;
    }

    const itemObj = priceList[categoryVal][itemIdx];
    
    cart.push({
      category: categoryVal,
      name: itemObj.name,
      price: itemObj.price,
      qty: qty
    });

    renderCart();
  }

  function deleteItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function renderCart() {
    const tbody = document.getElementById("cartTableBody");
    tbody.innerHTML = "";

    if (cart.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="color: #6c757d;">目前尚未加入任何品項</td></tr>';
      document.getElementById("totalDisplay").innerText = "預估總金額：$0 元";
      return;
    }

    let total = 0;
    let hasQuoteItem = false;

    cart.forEach((item, index) => {
      let tr = document.createElement("tr");
      let subtotalStr = "";

      if (item.price === "估價") {
        subtotalStr = "另行估價";
        hasQuoteItem = true;
      } else {
        let subtotal = item.price * item.qty;
        total += subtotal;
        subtotalStr = `$${subtotal}`;
      }

      tr.innerHTML = `
        <td>${item.category}</td>
        <td>${item.name}</td>
        <td>${item.price === "估價" ? "另行估價" : "$" + item.price}</td>
        <td>${item.qty}</td>
        <td>${subtotalStr}</td>
        <td><button class="btn-del" onclick="deleteItem(${index})">刪除</button></td>
      `;
      tbody.appendChild(tr);
    });

    let totalText = `預估總金額：$${total} 元`;
    if (hasQuoteItem) {
      totalText += " （包含另行估價品項）";
    }
    document.getElementById("totalDisplay").innerText = totalText;
  }

  // 送出預約單並發送至 Google Apps Script (對接 Google 試算表 & LINE)
  function submitOrder() {
    const name = document.getElementById("custName").value.trim();
    const phone = document.getElementById("custPhone").value.trim();
    const address = document.getElementById("custAddress").value.trim();
    const note = document.getElementById("orderNote").value.trim();
    const submitBtn = document.getElementById("submitBtn");

    if (!name || !phone) {
      alert("請填寫姓名與電話！");
      return;
    }

    if (cart.length === 0) {
      alert("請至少選擇一項送洗品項！");
      return;
    }

    // 格式化送洗明細字串
    let itemsDetail = cart.map(item => `${item.name} x${item.qty} (${item.price === '估價' ? '估價' : '$' + item.price})`).join('; ');
    let totalText = document.getElementById("totalDisplay").innerText;

    const payload = {
      name: name,
      phone: phone,
      address: address,
      items: itemsDetail,
      totalPrice: totalText,
      note: note,
      timestamp: new Date().toLocaleString("zh-TW", { timeZone: "Asia/Taipei" })
    };

    submitBtn.disabled = true;
    submitBtn.innerText = "資料傳送中...";

    // 使用 fetch 發送資料至 Google Apps Script
    fetch(scriptURL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
    .then(() => {
      alert("預約成功！明明專業洗衣已收到您的送洗單，資料已寫入試算表並推播通知，我們將儘快與您聯繫！");
      // 清空表單與購物車
      cart = [];
      renderCart();
      document.getElementById("custName").value = "";
      document.getElementById("custPhone").value = "";
      document.getElementById("custAddress").value = "";
      document.getElementById("orderNote").value = "";
      submitBtn.disabled = false;
      submitBtn.innerText = "送出預約單 (連動試算表與LINE)";
    })
    .catch(error => {
      console.error('Error:', error);
      alert("傳送失敗，請稍後再試或直接電話聯繫！");
      submitBtn.disabled = false;
      submitBtn.innerText = "送出預約單 (連動試算表與LINE)";
    });
  }
</script>

</body>
</html>
